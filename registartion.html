<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background-color:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:350px;
            padding:20px;
            border:2px solid black;
            border-radius:10px;
            background-color:white;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:8px;
            margin:8px 0;
        }

        .gender{
            text-align:left;
            margin-left:15px;
        }

        button{
            padding:8px 20px;
            margin:10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Registration Form</h2>

    <form>
        <label>First Name: <input type="text" name="firstName" placeholder="First Name" required></label><br>

        <label>Last Name: <input type="text" name="lastName" placeholder="Last Name" required></label><br>

        <label>Roll No: <input type="text" name="rollNo" placeholder="Roll No" required></label><br>

        <label>Email ID: <input type="email" name="email" placeholder="Email ID" required></label><br>
        <label>Mobile No: <input type="tel" name="mobile" placeholder="Mobile No" pattern="[0-9]{10}" required></label><br>
        <label>Date of Birth: <input type="date" name="dob" required></label><br>

        <div class="gender">
            <b>Gender:</b><br>
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </div>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</div>

</body>
</html>
